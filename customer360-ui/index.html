<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Customer 360 Agent Network</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <div class="logo" id="logo">◆</div>
      <div>
        <div class="company" id="companyName">Acme</div>
        <div class="tagline" id="tagline">Customer 360 Agent</div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="ctrl">
      <label for="industry">Industry</label>
      <select id="industry" onchange="onIndustryChange()"></select>
    </div>
    <div class="ctrl">
      <label for="customer">Customer</label>
      <select id="customer"></select>
    </div>
  </div>

  <main class="chat" id="chat">
    <!-- chat bubbles injected here -->
  </main>

  <div class="composer">
    <input id="message" placeholder="Ask the agent… e.g. Assess risk and take the best next action"
           onkeydown="if(event.key==='Enter') sendChat()" />
    <button id="go" onclick="sendChat()" title="Send">➤</button>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
